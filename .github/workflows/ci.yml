name: ci

# CI mínimo del MCP (QA P-08): build + tests + empaquetado en cada push y PR.
# Antes los tests solo corrían al taggear un release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Invariantes cross-repo (pasada 4): contract.test.mjs y pasada2-contratos.test.mjs
  # comparan contra el worker (WEBHOOK_EVENTS, TTL pending de idempotency). Antes este
  # job solo hacía checkout del repo propio y esos chequeos se salteaban (o pasaban sin
  # verificar nada) en CI. Ahora out-box va como carpeta hermana (sparse: solo
  # worker/src/lib) y OUTBOX_REQUIRE_SIBLINGS=1 hace que un hermano faltante FALLE. Si
  # jonathanleiva15/out-box es privado, cargar el secret OUTBOX_WORKER_CHECKOUT_TOKEN
  # (PAT fine-grained, solo `contents: read` sobre out-box).
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: out-box-mcp
    env:
      OUTBOX_REQUIRE_SIBLINGS: "1"
    steps:
      - name: Checkout out-box-mcp (este repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: out-box-mcp
          persist-credentials: false

      - name: Checkout out-box (hermano, solo worker/src/lib)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jonathanleiva15/out-box
          path: out-box
          token: ${{ secrets.OUTBOX_WORKER_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: |
            worker/src/lib

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: out-box-mcp/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Test (build + node --test)
        run: npm test

      - name: Empaquetado (npm pack --dry-run)
        run: npm pack --dry-run

  # Compat con el MCP remoto (pasada 4): out-box-mcp-remote importa la FUENTE de este
  # repo (tools.ts, schemas, client.ts vía su src/shared.ts). Un cambio acá podía
  # romper el remoto sin que nada lo detectara. Cuando cambia src/** (o el lock), se
  # hace checkout del remoto como carpeta hermana, con el mismo layout que la carpeta
  # local, y se corre su `npm run check` (tsc + vitest + wrangler deploy --dry-run,
  # sin credenciales de Cloudflare). Si out-box-mcp-remote es privado, cargar el
  # secret OUTBOX_MCP_REMOTE_CHECKOUT_TOKEN (PAT fine-grained, solo `contents: read`).
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.diff.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ¿Cambió src/**?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Sin base usable (primer push de la rama, force-push): se corre igual.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(src/|package(-lock)?\.json$)'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  remote-compat:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout out-box-mcp (este repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: out-box-mcp
          persist-credentials: false

      - name: Checkout out-box-mcp-remote (hermano)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jonathanleiva15/out-box-mcp-remote
          path: out-box-mcp-remote
          token: ${{ secrets.OUTBOX_MCP_REMOTE_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            out-box-mcp/package-lock.json
            out-box-mcp-remote/package-lock.json

      - name: Install out-box-mcp (npm ci)
        working-directory: out-box-mcp
        run: npm ci

      - name: Install out-box-mcp-remote (npm ci)
        working-directory: out-box-mcp-remote
        run: npm ci

      - name: Check del remoto (tsc + vitest + wrangler deploy --dry-run)
        working-directory: out-box-mcp-remote
        run: npm run check
